## MQTT settings for device ingestion.

# Every device must authenticate; no shared anonymous user.
mqtt.allow_anonymous = false

# MQTT publishes land on amq.topic in the device's vhost, where the
# ingest service's durable queue is bound (MQTT "/" becomes AMQP ".").
mqtt.exchange = amq.topic

# Devices pick their tenant vhost by logging in as "<vhost>:<username>".
# Users without a prefix fall back to this vhost.
mqtt.vhost = /

mqtt.listeners.tcp.default = 1883

# MQTT over TLS for devices. Certificates come from broker/gen-certs.sh
# (dev CA) or your own CA, mounted at /etc/rabbitmq/certs.
mqtt.listeners.ssl.default = 8883
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/server.pem
ssl_options.keyfile = /etc/rabbitmq/certs/server.key
# Devices authenticate with username/password, not client certificates.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

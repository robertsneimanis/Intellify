## MQTT settings for device ingestion.

# Every device must authenticate; no shared anonymous user.
mqtt.allow_anonymous = false

# MQTT publishes land on amq.topic in the device's vhost, where the
# ingest service's durable queue is bound (MQTT "/" becomes AMQP ".").
mqtt.exchange = amq.topic

# Devices pick their tenant vhost by logging in as "<vhost>:<username>".
# Users without a prefix fall back to this vhost.
mqtt.vhost = /

mqtt.listeners.tcp.default = 1883
